spring:
  application:
    name: auth_server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/auth_server?serverTimezone=Europe/Warsaw
    username: root
    password: admin
  jpa:
    database: mysql
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
      password:
      connect-timeout: 3s
      timeout: 3s
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [${spring.application.name},%X{trace_id},%X{span_id}] %logger{36} - %msg%n"
  level:
    org:
      zalando:
        logbook: trace

frontend:
  success-url: http://localhost:5173/login/success
  error-url: http://localhost:5173/login/failure

token:
  expiration: 7200

auth:
  keys:
    private-key-path: ""
    public-key-path: ""
  encryption:
    key:

usos:
  consumerKey: ""
  consumerSecret: ""
  requestTokenUrl: "https://usosapps.uwr.edu.pl/services/oauth/request_token"
  accessTokenUrl: "https://usosapps.uwr.edu.pl/services/oauth/access_token"
  authorizeUrl: "https://usosapps.uwr.edu.pl/services/oauth/authorize"
  callback: "http://localhost:8081/login/usos/callback"

server:
  port: 8081