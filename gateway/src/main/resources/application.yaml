spring:
  application:
    name: "gateway"

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lowerCaseServiceId: true
      httpclient:
        connect-timeout: 1000
        response-timeout: 10s
      default-filters:
        - TokenRelay

  data:
    redis:
      host: localhost
      port: 6379
      password:
      connect-timeout: 3s
      timeout: 3s

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        permittedNumberOfCallsInHalfOpenState: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s
        cancelRunningFuture: false

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [${spring.application.name},%X{trace_id},%X{span_id}] %logger{36} - %msg%n"
  level:
    org:
      zalando:
        logbook: trace

server:
  port: 8080