apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuer }}
spec:
  acme:
    server: {{ if eq .Values.issuer "letsencrypt-prod" }}https://acme-v02.api.letsencrypt.org/directory{{ else }}https://acme-staging-v02.api.letsencrypt.org/directory{{ end }}
    email: {{ .Values.email }}
    privateKeySecretRef:
      name: {{ .Values.issuer }}-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingressClass }}
