apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gradebook-ingress
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.issuer }}
spec:
  ingressClassName: {{ .Values.ingressClass }}
  tls:
    - hosts:
        - {{ .Values.domain }}
      secretName: gradebook-tls
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
