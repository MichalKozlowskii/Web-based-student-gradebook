deploymentName: attendance-deployment
serviceName: attendance
appLabel: attendance_service
appName: attendance_service

replicaCount: 1

image:
  repository: student_gradebook/attendance_service
  tag: prod

containerPort: 9010

service:
  type: ClusterIP
  port: 9010
  targetPort: 9010

appname_enabled: true
otel_enabled: true
resourceserver_enabled: true
redis_enabled: false
database_enabled: true

database:
  deploymentName: attendancedb-deployment
  serviceName: attendancedb
  appLabel: attendancedb
  name: attendancedb
  secretName: attendancedb-secret
  rootPassword: ""
  datasourceUrl: "jdbc:mysql://attendancedb:3306/attendancedb"
  image:
    repository: mysql
    tag: "8.0"
