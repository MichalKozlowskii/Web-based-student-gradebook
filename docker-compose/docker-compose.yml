services:
  authdb:
    container_name: auth_serverDB
    environment:
      MYSQL_DATABASE: authdb
    volumes:
      - authdb_data:/var/lib/mysql
    extends:
      file: common-config.yml
      service: db-config

  groupsdb:
    container_name: groups_serviceDB
    environment:
      MYSQL_DATABASE: groupsdb
    volumes:
      - groupsdb_data:/var/lib/mysql
    extends:
      file: common-config.yml
      service: db-config

  gradesdb:
    container_name: grades_serviceDB
    environment:
      MYSQL_DATABASE: gradesdb
    volumes:
      - gradesdb_data:/var/lib/mysql
    extends:
      file: common-config.yml
      service: db-config

  attendancedb:
    container_name: attendance_serviceDB
    environment:
      MYSQL_DATABASE: attendancedb
    volumes:
      - attendancedb_data:/var/lib/mysql
    extends:
      file: common-config.yml
      service: db-config

  examsdb:
    container_name: exams_serviceDB
    environment:
      MYSQL_DATABASE: examsdb
    volumes:
      - examsdb_data:/var/lib/mysql
    extends:
      file: common-config.yml
      service: db-config

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    extends:
      file: common-config.yml
      service: network-deploy-service

  auth:
    image: "frx420/auth_server:prod"
    container_name: auth_server
    depends_on:
      redis:
        condition: service_healthy
      authdb:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8081/actuator/health/readiness | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "auth_server"
      SPRING_DATASOURCE_URL: "jdbc:mysql://authdb:3306/authdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      AUTH_KEYS_PRIVATE_KEY_PATH: "/keys/private.pem"
      AUTH_KEYS_PUBLIC_KEY_PATH: "/keys/public.pem"
      AUTH_ENCRYPTION_KEY: "${AUTH_ENCRYPTION_KEY}"
      USOS_CONSUMERKEY: "${USOS_CONSUMERKEY}"
      USOS_CONSUMERSECRET: "${USOS_CONSUMERSECRET}"
      USOS_CALLBACK: "${USOS_CALLBACK}"
      FRONTEND_SUCCESS_URL: "${FRONTEND_SUCCESS_URL}"
      FRONTEND_ERROR_URL: "${FRONTEND_ERROR_URL}"
    volumes:
      - ./keys/private.pem:/keys/private.pem:ro
      - ./keys/public.pem:/keys/public.pem:ro
    extends:
      file: common-config.yml
      service: microservice-base-config

  groups:
    image: "frx420/groups_service:prod"
    container_name: groups_service
    depends_on:
      auth:
        condition: service_healthy
      groupsdb:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8090/actuator/health/readiness | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "groups_service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://groupsdb:3306/groupsdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true"
    extends:
      file: common-config.yml
      service: microservice-base-config

  grades:
    image: "frx420/grades_service:prod"
    container_name: grades_service
    depends_on:
      auth:
        condition: service_healthy
      gradesdb:
        condition: service_healthy
      groups:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:9000/actuator/health/readiness | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "grades_service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://gradesdb:3306/gradesdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true"
    extends:
      file: common-config.yml
      service: microservice-base-config

  attendance:
    image: "frx420/attendance_service:prod"
    container_name: attendance_service
    depends_on:
      auth:
        condition: service_healthy
      attendancedb:
        condition: service_healthy
      groups:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:9010/actuator/health/readiness | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "attendance_service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://attendancedb:3306/attendancedb?sslMode=REQUIRED&allowPublicKeyRetrieval=true"
    extends:
      file: common-config.yml
      service: microservice-base-config

  summary:
    image: "frx420/summary_service:prod"
    container_name: summary_service
    depends_on:
      auth:
        condition: service_healthy
      grades:
        condition: service_healthy
      attendance:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:9020/actuator/health/readiness | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "summary_service"
    extends:
      file: common-config.yml
      service: microservice-base-config

  exams:
    image: "frx420/exams_service:prod"
    container_name: exams_service
    depends_on:
      auth:
        condition: service_healthy
      examsdb:
        condition: service_healthy
      grades:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:9030/actuator/health/readiness | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "exams_service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://examsdb:3306/examsdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true"
      AZURE_VISION_ENDPOINT: "${AZURE_VISION_ENDPOINT}"
      AZURE_VISION_KEY: "${AZURE_VISION_KEY}"
    extends:
      file: common-config.yml
      service: microservice-base-config

  gatewayserver:
    image: "frx420/gateway:prod"
    container_name: gatewayserver
    depends_on:
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      groups:
        condition: service_healthy
      grades:
        condition: service_healthy
      attendance:
        condition: service_healthy
      summary:
        condition: service_healthy
      exams:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "gateway"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: "${REDIS_PASSWORD}"
    extends:
      file: common-config.yml
      service: microservice-base-config

  frontend:
    image: "frx420/frontend:prod"
    networks:
      - gradebook

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      gatewayserver:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - gradebook

networks:
  gradebook:
    driver: "bridge"

volumes:
  authdb_data:
  groupsdb_data:
  gradesdb_data:
  attendancedb_data:
  examsdb_data:
